name: Weekly puzzles
on:
  schedule: [{ cron: "0 10 * * 1" }]  # Mondays 10:00 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run weekly
      - run: npm test
      - name: Commit new puzzles
        run: |
          git config user.name "puzzle-bot"; git config user.email "puzzle-bot@users.noreply.github.com"
          git add src/data && (git diff --cached --quiet || (git commit -m "chore: weekly puzzles $(date -u +%F)" && git push))
